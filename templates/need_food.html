
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Need Food - Second Serve</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="about">
        <h2>Food Request for NGOs</h2>
        <p>Registered NGOs can share their food requirements here.</p>

        <form action="/need-food" method="POST">
            <label>NGO Name</label><br>
            <input type="text" name="ngo_name" required><br><br>

            <label>Contact Person</label><br>
            <input type="text" name="contact_person" required><br><br>

            <label>Required Food / Meals</label><br>
            <input type="text" name="food_required" required><br><br>

            <label>Quantity Required</label><br>
            <input type="text" name="quantity" required><br><br>

            <label>Delivery Address</label><br>
            <textarea name="address" required></textarea><br><br>

            <label>Contact Number</label><br>
            <input type="tel" name="contact" required><br><br>

            <button type="submit">Submit Request</button>
        </form>

        <p><a href="/">Back to Home</a></p>
    </div>
</body>
</html>
